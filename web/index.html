<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPA Template</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <!-- No bundler: bare module specifiers resolve through this import map.
       Add libraries here (a CDN URL or a local copy) and import them by name. -->
  <script type="importmap">
  {
    "imports": {
      "app": "./main.js"
    }
  }
  </script>
</head>
<body>
  <main id="app">
    <h1>Hello, world!</h1>
    <p id="status">Loading…</p>
  </main>
  <script type="module">
    import { init } from "app";
    init();
  </script>
</body>
</html>
